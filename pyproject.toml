[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-video-system"
version = "0.1.0"
description = "Two-device video preprocessing, streaming, and edge AI inference demo"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "websockets>=13,<16",
]

[project.optional-dependencies]
device = [
  "opencv-python-headless>=4.9,<6",
]
edge = [
  "fastapi>=0.115,<1",
  "lap>=0.5.12,<1",
  "uvicorn[standard]>=0.30,<1",
  "ultralytics>=8.3,<9",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
edge-video-device = "edge_video.device:main"
edge-video-server = "edge_video.edge:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edge_video = ["web/*.html"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
