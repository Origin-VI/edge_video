<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edge Video Monitor</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #111514;
      color: #edf2ef;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #111514; }
    header {
      min-height: 64px;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #323a37;
      background: #171c1a;
    }
    h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: 0; }
    #connection { color: #f0b95a; font-size: 14px; }
    #connection.streaming { color: #65d59a; }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      min-height: calc(100vh - 64px);
    }
    .video-area {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 500px;
      padding: 20px;
      background: #090c0b;
      overflow: hidden;
    }
    .video-area img {
      display: block;
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 104px);
      object-fit: contain;
    }
    .waiting {
      position: absolute;
      color: #8e9994;
      font-size: 15px;
      pointer-events: none;
    }
    aside {
      padding: 18px;
      border-left: 1px solid #323a37;
      background: #171c1a;
      overflow-y: auto;
    }
    h2 {
      margin: 4px 0 14px;
      font-size: 14px;
      font-weight: 650;
      color: #a9b5af;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    dl { margin: 0 0 28px; }
    .metric {
      min-height: 40px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #2b322f;
    }
    dt { color: #a9b5af; font-size: 13px; }
    dd { margin: 0; font-variant-numeric: tabular-nums; font-size: 14px; }
    #objects { margin: 0; padding: 0; list-style: none; }
    #objects li {
      padding: 9px 0;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #2b322f;
      font-size: 14px;
    }
    @media (max-width: 840px) {
      main { grid-template-columns: 1fr; }
      .video-area { min-height: 56vw; padding: 10px; }
      aside { border-left: 0; border-top: 1px solid #323a37; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Edge Video Monitor</h1>
    <span id="connection">等待设备</span>
  </header>
  <main>
    <section class="video-area">
      <span class="waiting" id="waiting">等待树莓派视频流...</span>
      <img src="/stream.mjpg" alt="AI 检测视频流" id="stream">
    </section>
    <aside>
      <h2>实时性能</h2>
      <dl>
        <div class="metric"><dt>接收速率</dt><dd id="ingest_fps">0 fps</dd></div>
        <div class="metric"><dt>推理速率</dt><dd id="processing_fps">0 fps</dd></div>
        <div class="metric"><dt>端侧处理</dt><dd id="endpoint_processing_ms">-</dd></div>
        <div class="metric"><dt>网络传输</dt><dd id="network_ms">-</dd></div>
        <div class="metric"><dt>时钟同步 RTT</dt><dd id="clock_rtt_ms">-</dd></div>
        <div class="metric"><dt>AI 推理</dt><dd id="inference_ms">-</dd></div>
        <div class="metric"><dt>端到端延迟</dt><dd id="end_to_end_ms">-</dd></div>
        <div class="metric"><dt>压缩帧大小</dt><dd id="jpeg_kb">-</dd></div>
        <div class="metric"><dt>主动丢旧帧</dt><dd id="dropped_frames">0</dd></div>
      </dl>
      <h2>当前检测结果</h2>
      <ul id="objects"><li><span>暂无目标</span><span>-</span></li></ul>
    </aside>
  </main>
  <script>
    const metricUnits = {
      ingest_fps: " fps",
      processing_fps: " fps",
      endpoint_processing_ms: " ms",
      network_ms: " ms",
      clock_rtt_ms: " ms",
      inference_ms: " ms",
      end_to_end_ms: " ms",
      jpeg_kb: " KB",
      dropped_frames: ""
    };

    async function refreshStatus() {
      try {
        const response = await fetch("/api/status", { cache: "no-store" });
        const data = await response.json();
        const status = document.getElementById("connection");
        const streaming = data.status === "streaming";
        status.textContent = streaming ? `正在接收 ${data.connected_devices.join(", ")}` : "等待设备";
        status.classList.toggle("streaming", streaming);
        document.getElementById("waiting").style.display = data.processed_frames > 0 ? "none" : "block";

        for (const [key, unit] of Object.entries(metricUnits)) {
          const value = data[key];
          document.getElementById(key).textContent = value === null || value === undefined ? "-" : `${value}${unit}`;
        }

        const objects = document.getElementById("objects");
        objects.replaceChildren();
        const detections = data.objects || [];
        if (detections.length === 0) {
          objects.innerHTML = "<li><span>暂无目标</span><span>-</span></li>";
        } else {
          for (const item of detections) {
            const row = document.createElement("li");
            const label = document.createElement("span");
            const confidence = document.createElement("span");
            label.textContent = item.label;
            confidence.textContent = `${Math.round(item.confidence * 100)}%`;
            row.append(label, confidence);
            objects.append(row);
          }
        }
      } catch (_) {
        document.getElementById("connection").textContent = "服务连接中断";
      }
    }

    refreshStatus();
    setInterval(refreshStatus, 1000);
  </script>
</body>
</html>
