<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edge Video Monitor</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #111514;
      color: #edf2ef;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #111514; }
    header {
      min-height: 64px;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #323a37;
      background: #171c1a;
    }
    h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: 0; }
    #connection { color: #f0b95a; font-size: 14px; }
    #connection.streaming { color: #65d59a; }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      min-height: calc(100vh - 64px);
    }
    .video-area {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 500px;
      padding: 20px;
      background: #090c0b;
      overflow: hidden;
    }
    .video-area img {
      display: block;
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 104px);
      object-fit: contain;
    }
    .waiting {
      position: absolute;
      color: #8e9994;
      font-size: 15px;
      pointer-events: none;
    }
    aside {
      padding: 18px;
      border-left: 1px solid #323a37;
      background: #171c1a;
      overflow-y: auto;
    }
    h2 {
      margin: 4px 0 14px;
      font-size: 14px;
      font-weight: 650;
      color: #a9b5af;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    dl { margin: 0 0 28px; }
    .metric {
      min-height: 40px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #2b322f;
    }
    dt { color: #a9b5af; font-size: 13px; }
    dd { margin: 0; font-variant-numeric: tabular-nums; font-size: 14px; }
    #objects { margin: 0; padding: 0; list-style: none; }
    #objects li, #events li {
      padding: 9px 0;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #2b322f;
      font-size: 14px;
    }
    #events { margin: 0; padding: 0; list-style: none; }
    .section-gap { margin-top: 28px; }
    .enroll-form { display: grid; gap: 10px; margin-bottom: 14px; }
    .enroll-form input {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid #3a4540;
      border-radius: 5px;
      color: #edf2ef;
      background: #101412;
      font: inherit;
    }
    .enroll-form input[type="file"] { padding: 7px; font-size: 12px; }
    button {
      min-height: 38px;
      border: 1px solid #4c9d73;
      border-radius: 5px;
      color: #07120c;
      background: #65d59a;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: wait; }
    .form-message { min-height: 20px; margin: 0; color: #a9b5af; font-size: 12px; }
    .form-message.error { color: #f08b78; }
    .face-list { display: grid; gap: 1px; margin: 0; padding: 0; list-style: none; }
    .face-row {
      min-height: 58px;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #2b322f;
    }
    .face-row img {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      object-fit: cover;
      background: #090c0b;
    }
    .face-row span { overflow-wrap: anywhere; font-size: 14px; }
    .delete-face {
      width: 34px;
      min-height: 34px;
      padding: 0;
      border-color: #5b3733;
      color: #f0a194;
      background: transparent;
      font-size: 19px;
      line-height: 1;
    }
    .identity-known { color: #65d59a; }
    .identity-stranger { color: #f0b95a; }
    @media (max-width: 840px) {
      main { grid-template-columns: 1fr; }
      .video-area { min-height: 56vw; padding: 10px; }
      aside { border-left: 0; border-top: 1px solid #323a37; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Edge Video Monitor</h1>
    <span id="connection">等待设备</span>
  </header>
  <main>
    <section class="video-area">
      <span class="waiting" id="waiting">等待树莓派视频流...</span>
      <img src="/stream.mjpg" alt="AI 检测视频流" id="stream">
    </section>
    <aside>
      <h2>实时性能</h2>
      <dl>
        <div class="metric"><dt>接收速率</dt><dd id="ingest_fps">0 fps</dd></div>
        <div class="metric"><dt>推理速率</dt><dd id="processing_fps">0 fps</dd></div>
        <div class="metric"><dt>端侧处理</dt><dd id="endpoint_processing_ms">-</dd></div>
        <div class="metric"><dt>网络传输</dt><dd id="network_ms">-</dd></div>
        <div class="metric"><dt>时钟同步 RTT</dt><dd id="clock_rtt_ms">-</dd></div>
        <div class="metric"><dt>AI 推理</dt><dd id="inference_ms">-</dd></div>
        <div class="metric"><dt>端到端延迟</dt><dd id="end_to_end_ms">-</dd></div>
        <div class="metric"><dt>压缩帧大小</dt><dd id="jpeg_kb">-</dd></div>
        <div class="metric"><dt>主动丢旧帧</dt><dd id="dropped_frames">0</dd></div>
      </dl>
      <h2>区域统计</h2>
      <dl>
        <div class="metric"><dt>区域内人数</dt><dd id="current_inside">0</dd></div>
        <div class="metric"><dt>活跃轨迹</dt><dd id="active_tracks">0</dd></div>
        <div class="metric"><dt>累计进入</dt><dd id="total_entered">0</dd></div>
        <div class="metric"><dt>累计离开</dt><dd id="total_exited">0</dd></div>
      </dl>
      <h2>当前检测结果</h2>
      <ul id="objects"><li><span>暂无目标</span><span>-</span></li></ul>
      <h2 class="section-gap">最近事件</h2>
      <ul id="events"><li><span>暂无事件</span><span>-</span></li></ul>
      <h2 class="section-gap">门禁人员库</h2>
      <form id="enroll-form" class="enroll-form">
        <input id="person-name" name="name" maxlength="64" required placeholder="姓名" autocomplete="off">
        <input id="person-photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp" required>
        <button id="enroll-button" type="submit">登记人员</button>
        <p id="form-message" class="form-message" aria-live="polite"></p>
      </form>
      <ul id="face-list" class="face-list"><li class="face-row"><span></span><span>暂无登记人员</span></li></ul>
    </aside>
  </main>
  <script>
    const metricUnits = {
      ingest_fps: " fps",
      processing_fps: " fps",
      endpoint_processing_ms: " ms",
      network_ms: " ms",
      clock_rtt_ms: " ms",
      inference_ms: " ms",
      end_to_end_ms: " ms",
      jpeg_kb: " KB",
      dropped_frames: "",
      current_inside: "",
      active_tracks: "",
      total_entered: "",
      total_exited: ""
    };

    async function refreshStatus() {
      try {
        const response = await fetch("/api/status", { cache: "no-store" });
        const data = await response.json();
        const status = document.getElementById("connection");
        const streaming = data.status === "streaming";
        status.textContent = streaming ? `正在接收 ${data.connected_devices.join(", ")}` : "等待设备";
        status.classList.toggle("streaming", streaming);
        document.getElementById("waiting").style.display = data.processed_frames > 0 ? "none" : "block";

        for (const [key, unit] of Object.entries(metricUnits)) {
          const value = data[key];
          document.getElementById(key).textContent = value === null || value === undefined ? "-" : `${value}${unit}`;
        }

        const objects = document.getElementById("objects");
        objects.replaceChildren();
        const detections = data.objects || [];
        if (detections.length === 0) {
          objects.innerHTML = "<li><span>暂无目标</span><span>-</span></li>";
        } else {
          for (const item of detections) {
            const row = document.createElement("li");
            const label = document.createElement("span");
            const confidence = document.createElement("span");
            const track = item.track_id === undefined ? "" : `#${item.track_id} `;
            const region = item.inside_roi ? " · ROI" : "";
            const identity = item.label === "person" ? ` · ${item.identity || "stranger"}` : "";
            label.textContent = `${track}${item.label}${identity}${region}`;
            if (item.label === "person") {
              label.className = item.identity && item.identity !== "stranger" ? "identity-known" : "identity-stranger";
            }
            confidence.textContent = `${Math.round(item.confidence * 100)}%`;
            row.append(label, confidence);
            objects.append(row);
          }
        }

        const events = document.getElementById("events");
        events.replaceChildren();
        const recentEvents = data.recent_events || [];
        if (recentEvents.length === 0) {
          events.innerHTML = "<li><span>暂无事件</span><span>-</span></li>";
        } else {
          for (const item of recentEvents.slice(0, 8)) {
            const row = document.createElement("li");
            const label = document.createElement("span");
            const timestamp = document.createElement("span");
            label.textContent = `#${item.track_id} ${item.type === "entered" ? "进入" : "离开"}`;
            timestamp.textContent = new Date(item.timestamp * 1000).toLocaleTimeString();
            row.append(label, timestamp);
            events.append(row);
          }
        }
      } catch (_) {
        document.getElementById("connection").textContent = "服务连接中断";
      }
    }

    async function refreshFaces() {
      const list = document.getElementById("face-list");
      try {
        const response = await fetch("/api/faces", { cache: "no-store" });
        const data = await response.json();
        list.replaceChildren();
        if (!data.enabled) {
          list.innerHTML = '<li class="face-row"><span></span><span>人脸识别未启用</span></li>';
          document.getElementById("enroll-button").disabled = true;
          return;
        }
        if (!data.identities.length) {
          list.innerHTML = '<li class="face-row"><span></span><span>暂无登记人员</span></li>';
          return;
        }
        for (const identity of data.identities) {
          const row = document.createElement("li");
          row.className = "face-row";
          const photo = document.createElement("img");
          photo.src = identity.photo_url;
          photo.alt = `${identity.name} 的登记照`;
          const name = document.createElement("span");
          name.textContent = identity.name;
          const remove = document.createElement("button");
          remove.className = "delete-face";
          remove.type = "button";
          remove.textContent = "×";
          remove.title = `删除 ${identity.name}`;
          remove.setAttribute("aria-label", `删除 ${identity.name}`);
          remove.addEventListener("click", () => deleteFace(identity));
          row.append(photo, name, remove);
          list.append(row);
        }
      } catch (_) {
        list.innerHTML = '<li class="face-row"><span></span><span>人员库读取失败</span></li>';
      }
    }

    async function deleteFace(identity) {
      if (!window.confirm(`确定删除 ${identity.name} 的登记信息吗？`)) return;
      const response = await fetch(`/api/faces/${identity.id}`, { method: "DELETE" });
      if (response.ok) await refreshFaces();
    }

    document.getElementById("enroll-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = document.getElementById("enroll-button");
      const message = document.getElementById("form-message");
      button.disabled = true;
      message.className = "form-message";
      message.textContent = "正在提取人脸特征...";
      try {
        const response = await fetch("/api/faces", { method: "POST", body: new FormData(form) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "登记失败");
        form.reset();
        message.textContent = `${data.name} 已登记`;
        await refreshFaces();
      } catch (error) {
        message.className = "form-message error";
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    refreshStatus();
    refreshFaces();
    setInterval(refreshStatus, 1000);
  </script>
</body>
</html>
